services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soilwise
      POSTGRES_USER: soilwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soilwise_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soilwise -d soilwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://soilwise:${POSTGRES_PASSWORD:-soilwise_dev_password}@db:5432/soilwise
      UPLOAD_DIR: uploads
    volumes:
      - uploads_data:/app/uploads
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
